name: Build

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - run: npm run build
